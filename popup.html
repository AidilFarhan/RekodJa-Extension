<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    width: 320px;
    padding: 14px;
    color: #252525;
    background: #fafaf9;
  }
  h3 { margin: 0 0 10px 0; font-size: 15px; color: #14213d; letter-spacing: -.3px; }
  label { display: block; margin-top: 10px; font-size: 12px; font-weight: 600; color: #14213d; }
  input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    margin-top: 4px;
    box-sizing: border-box;
    border: 1px solid #d5dbe4;
    border-radius: 5px;
    font-size: 13px;
    background: #fff;
    color: #252525;
  }
  button {
    margin-top: 14px;
    width: 100%;
    padding: 9px;
    background: #14213d;
    color: #fff;
    border: 1px solid #14213d;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  button:disabled { background: #9ca3af; border-color: #9ca3af; cursor: not-allowed; }
  #openSheetBtn { background: #fff; color: #14213d; border: 1px solid #d7dce4; }
  #status { margin-top: 10px; font-size: 12px; min-height: 14px; color: #555; }
  #status.error { color: #a53535; }
  #status.success { color: #176b35; }
  .settings-toggle {
    margin-top: 12px;
    font-size: 11px;
    color: #626976;
    text-align: right;
    cursor: pointer;
    text-decoration: underline;
  }
  #settingsPanel {
    display: none;
    margin-top: 10px;
    border-top: 1px solid #e5e7eb;
    padding-top: 10px;
  }
  #settingsPanel button { background: #14213d; }
  .hint { font-size: 11px; color: #626976; margin-top: 3px; }
  hr { border: 0; border-top: 1px solid #e5e7eb; }
</style>
</head>
<body>
  <h3>Add to RekodJa</h3>

  <label for="jobLink">Job Link</label>
  <input type="text" id="jobLink" placeholder="https://...">

  <label for="dateApplied">Date Applied</label>
  <input type="text" id="dateApplied" placeholder='e.g. "2 weeks ago", "today"'>
  <div class="hint">Leave blank to fill in later directly in the sheet</div>

  <button id="saveBtn">Save</button>
  <button id="openSheetBtn">Access Spreadsheet</button>
  <div id="status"></div>

  <div class="settings-toggle" id="settingsToggle">Settings</div>
  <div id="settingsPanel">
    <label for="sheetId">Google Sheet ID</label>
    <input type="text" id="sheetId" placeholder="From your sheet's URL, between /d/ and /edit">
    <div class="hint">e.g. docs.google.com/spreadsheets/d/<b>THIS_PART</b>/edit</div>
    <button id="saveSettingsBtn">Save Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
